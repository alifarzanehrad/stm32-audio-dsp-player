<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4c81"/>
      <stop offset="1" stop-color="#137c8b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334e68"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#f8fbfd"/>
  <text x="600" y="58" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#102a43" text-anchor="middle">Real-Time Audio Processing Pipeline</text>
  <text x="600" y="94" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#486581" text-anchor="middle">STM32F746G-DISCO Audio DSP Player</text>

  <rect x="390" y="135" width="420" height="82" rx="18" fill="#ffffff" stroke="#7b9db4" stroke-width="3"/>
  <text x="600" y="165" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">WAV Files on SD Card</text>
  <text x="600" y="195" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">Stereo PCM16, 48 kHz</text>

  <path d="M600 217 V255" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="260" width="420" height="82" rx="18" fill="#ffffff" stroke="#7b9db4" stroke-width="3"/>
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">FATFS and WAV Parser</text>
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">Dynamic playlist and audio data read</text>

  <path d="M600 342 V380" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="385" width="420" height="82" rx="18" fill="#ffffff" stroke="#7b9db4" stroke-width="3"/>
  <text x="600" y="415" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">DMA Half-Buffer</text>
  <text x="600" y="445" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">1024 stereo frames, 21.333 ms deadline</text>

  <path d="M600 467 V505" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="510" width="420" height="72" rx="18" fill="#ffffff" stroke="#7b9db4" stroke-width="3"/>
  <text x="600" y="554" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">Int16 to Float Conversion</text>

  <path d="M600 582 V620" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="625" width="420" height="82" rx="18" fill="#e7f7f8" stroke="#137c8b" stroke-width="3"/>
  <text x="600" y="655" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">Adaptive Noise Reduction</text>
  <text x="600" y="685" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">512-point STFT, optional</text>

  <path d="M600 707 V745" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="750" width="420" height="82" rx="18" fill="#e7f7f8" stroke="#137c8b" stroke-width="3"/>
  <text x="600" y="780" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">Five-Band Equalizer</text>
  <text x="600" y="810" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">IIR biquads and headroom, optional</text>

  <path d="M600 832 V870" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="875" width="420" height="72" rx="18" fill="#e7f7f8" stroke="#137c8b" stroke-width="3"/>
  <text x="600" y="919" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">Echo, Optional</text>

  <path d="M600 947 V985" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="990" width="420" height="82" rx="18" fill="#e7f7f8" stroke="#137c8b" stroke-width="3"/>
  <text x="600" y="1020" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">Schroeder Reverb</text>
  <text x="600" y="1050" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">Comb and all-pass filters, optional</text>

  <path d="M600 1072 V1110" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="1115" width="420" height="82" rx="18" fill="#ffffff" stroke="#7b9db4" stroke-width="3"/>
  <text x="600" y="1145" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">Limiter and Float to Int16</text>
  <text x="600" y="1175" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">Processed audio output</text>

  <path d="M510 1197 V1240 H270 V1275" fill="none" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="90" y="1280" width="360" height="82" rx="18" fill="#edf4ff" stroke="#0f4c81" stroke-width="3"/>
  <text x="270" y="1310" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">SAI2 DMA and WM8994</text>
  <text x="270" y="1340" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">Codec output to headphones</text>

  <path d="M690 1197 V1240 H930 V1275" fill="none" stroke="#137c8b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="750" y="1280" width="360" height="82" rx="18" fill="#edf4ff" stroke="#0f4c81" stroke-width="3"/>
  <text x="930" y="1310" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#102a43" text-anchor="middle">1024-Point Display FFT</text>
  <text x="930" y="1340" font-family="Arial, sans-serif" font-size="19" fill="#486581" text-anchor="middle">16-band TouchGFX spectrum</text>

  <rect x="360" y="1410" width="480" height="52" rx="26" fill="#0f667a"/>
  <text x="600" y="1443" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">FreeRTOS Task Coordination</text>
</svg>
